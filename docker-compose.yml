services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Translates the Upstash REST API used by the app into plain Redis commands
  redis-rest:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${REDIS_REST_TOKEN:-change-me}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      UPSTASH_REDIS_REST_URL: http://redis-rest:80
      UPSTASH_REDIS_REST_TOKEN: ${REDIS_REST_TOKEN:-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      - redis-rest
    restart: unless-stopped

volumes:
  redis-data:
